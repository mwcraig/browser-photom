# Build the Voici photometry dashboard and publish it to GitHub Pages.
#
# One-time repo setting required: Settings -> Pages -> Source: "GitHub Actions".
#
# The kernel's emscripten environment (environment.yml) is re-solved on every
# run by jupyterlite-xeus; it is not covered by pixi.lock, so an upstream
# emscripten-forge change can alter what gets deployed.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: dash
          cache: true

      # Also runs the fetch-* tasks (full clones of bandaid, eloy, astrowidgets,
      # AAVSO/public-utils for the starlist schema) that environment.yml's pip:
      # block points at.
      - name: Build with voici
        run: pixi run -e dash build-dash

      - name: Land visitors on the dashboard, not Voici's notebook index
        run: |
          cp pages/index.html dist-dash/index.html
          touch dist-dash/.nojekyll
          du -sh dist-dash

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-dash

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
