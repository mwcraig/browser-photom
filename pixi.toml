[workspace]
authors = ["Matt Craig <mattwcraig@gmail.com>"]
channels = ["conda-forge"]
name = "browser-photom"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
# Every fetch-* task clones only when the checkout is missing, and otherwise
# lets the fetch/pull/checkout fail loudly: the earlier `cmd 2>/dev/null ||
# git clone` shape hid the real error (a dirty tree, an unfetched commit) and
# then failed on "destination path already exists" instead.
fetch-astrowidgets = "(test -d astrowidgets-src || git clone https://github.com/astropy/astrowidgets astrowidgets-src) && git -C astrowidgets-src pull --ff-only"
# Full clone (not shallow) so hatch-vcs sees tags. Pinned (detached HEAD) to the
# bandaid commit the dashboard was validated against, so a redeploy cannot
# silently pick up whatever bandaid main is at build time. 33bebf5 is the
# merge of bandaid PR #147 (measured-versus-modelled centroid positions), which
# made `process_one_image` require `input_gaia_g` and `g_cut`; move the pin
# deliberately, together with the call in `make_bandaid_processor` (the one
# place this repo calls bandaid; the watch notebook goes through it too).
fetch-bandaid = "(test -d bandaid-src || git clone https://github.com/mwcraig/bandaid bandaid-src) && git -C bandaid-src fetch && git -C bandaid-src checkout 33bebf5"
# Pinned to the commit bandaid's pyproject pins (detached HEAD)
fetch-eloy = "(test -d eloy-src || git clone https://github.com/mwcraig/eloy eloy-src) && git -C eloy-src fetch && git -C eloy-src checkout a056c91a945772e0520a89695f8fcd16fda36870"
fetch-starlist-schema = "(test -d aavso-starlist-schema-src || git clone https://github.com/mwcraig/aavso-starlist-schema aavso-starlist-schema-src) && git -C aavso-starlist-schema-src pull --ff-only"
build = { cmd = "jupyter lite build --contents content --output-dir dist", depends-on = ["fetch-astrowidgets", "fetch-bandaid", "fetch-eloy", "fetch-starlist-schema"] }
serve = "python -m http.server 8000 --directory dist"
# Image file server + CORS proxy on :8001 (see content/helper.py), e.g.
#   pixi run helper ~/Downloads/ey_uma
helper = "python scripts/local_helper.py"
test = "pytest"
# The glob is quoted so node expands it: node >= 22 treats a bare directory
# positional as a glob pattern and matches the directory itself, not the
# files under it.
test-js = "node --test 'tests/js/**/*.test.mjs'"

[dependencies]
python = ">=3.11"
pip = "*"
jupyter_server = "*"
jupyterlite-core = "*"
jupyterlite-xeus = ">=5"
# anywidget must be pinned to the SAME version in environment.yml: `jupyter
# lite build` copies the prebuilt labextension out of this env's
# share/jupyter/labextensions, and the front end silently fails to register
# the widget if that build differs from the one the kernel imports.
anywidget = "==0.11.0"
pytest = "*"
nodejs = "*"

# Voici lives in its own environment on purpose: voici 0.10 -> voici-core pins
# jupyterlite-core >=0.7,<0.8, and the default environment resolves 0.8.x.
# Putting voici in [dependencies] would silently downgrade the JupyterLab dev
# site that `pixi run build` produces.
[feature.dash.dependencies]
voici = "*"
anywidget = "==0.11.0"

[feature.dash.tasks]
build-dash = { cmd = "voici build --contents content --output-dir dist-dash", depends-on = ["fetch-astrowidgets", "fetch-bandaid", "fetch-eloy", "fetch-starlist-schema"] }
serve-dash = "python -m http.server 8010 --directory dist-dash"

[environments]
dash = ["dash"]
