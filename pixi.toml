[workspace]
authors = ["Matt Craig <mattwcraig@gmail.com>"]
channels = ["conda-forge"]
name = "browser-photom"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
fetch-astrowidgets = "git -C astrowidgets-src pull --ff-only 2>/dev/null || git clone https://github.com/astropy/astrowidgets astrowidgets-src"
# Full clone (not shallow) so hatch-vcs sees tags; branch numpy-ballet = tip of PR #94
fetch-bandaid = "(git -C bandaid-src fetch && git -C bandaid-src checkout numpy-ballet && git -C bandaid-src pull --ff-only) 2>/dev/null || git clone --branch numpy-ballet https://github.com/mwcraig/bandaid bandaid-src"
# Pinned to the commit bandaid's pyproject pins (detached HEAD)
fetch-eloy = "(git -C eloy-src fetch && git -C eloy-src checkout a056c91a945772e0520a89695f8fcd16fda36870) 2>/dev/null || (git clone https://github.com/mwcraig/eloy eloy-src && git -C eloy-src checkout a056c91a945772e0520a89695f8fcd16fda36870)"
fetch-starlist-schema = "git -C aavso-starlist-schema-src pull --ff-only 2>/dev/null || git clone https://github.com/mwcraig/aavso-starlist-schema aavso-starlist-schema-src"
build = { cmd = "jupyter lite build --contents content --output-dir dist", depends-on = ["fetch-astrowidgets", "fetch-bandaid", "fetch-eloy", "fetch-starlist-schema"] }
serve = "python -m http.server 8000 --directory dist"
# Image file server + CORS proxy on :8001 (see content/helper.py), e.g.
#   pixi run helper ~/Downloads/ey_uma
helper = "python scripts/local_helper.py"

[dependencies]
python = ">=3.11"
pip = "*"
jupyter_server = "*"
jupyterlite-core = "*"
jupyterlite-xeus = ">=5"
