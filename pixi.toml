[workspace]
authors = ["Matt Craig <mattwcraig@gmail.com>"]
channels = ["conda-forge"]
name = "browser-photom"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
# Every fetch-* task clones only when the checkout is missing, and otherwise
# lets the fetch/pull/checkout fail loudly: the earlier `cmd 2>/dev/null ||
# git clone` shape hid the real error (a dirty tree, an unfetched commit) and
# then failed on "destination path already exists" instead.
fetch-astrowidgets = "(test -d astrowidgets-src || git clone https://github.com/astropy/astrowidgets astrowidgets-src) && git -C astrowidgets-src pull --ff-only"
# Full clone (not shallow) so hatch-vcs sees tags. Pinned (detached HEAD) to the
# bandaid commit the dashboard was validated against, so a redeploy cannot
# silently pick up whatever bandaid main is at build time. e29ed5c is the
# merge of bandaid PR #177 (closes bandaid #176): `prepare_batch` takes the
# batch's frame list (its first parameter is `files`, was `first_file`; a
# single path is still accepted as a one-frame batch, so the positional call
# in `make_bandaid_processor` is unchanged) and prepares the batch from the
# first frame, in batch order, that yields an FWHM, passing over frames that
# raise `TooFewStarsError` or `PSFFitError`; any other error on the first
# frame, and every Gaia, instrument and obs-time failure, stays fatal.
# `BatchPrep` gains `prep_file`, and the `BatchPrepError` names the frame
# ("cannot measure an FWHM on <file>: ..."). In the browser frames arrive one
# at a time, so `make_bandaid_processor` hands `prepare_batch` one path per
# attempt and does the walk itself by retrying prep on the next dropped
# frame; this pin changes the skip text the dashboard shows and nothing it
# computes (`photometry.py` and `writers.py` have no diff). The previous
# pin, 66b4e03 (PR #175, closes #174), added `PSFFitError`, raised when the
# fitted FWHM exceeds `fwhm_cutout_half` (25 px on the Seestar50 profile):
# a frame with no real star image could fit an 85 px FWHM and, with
# apertures sized in FWHM, a ~1400 px annulus mask per star, the per-frame
# MemoryError rows in the tester reports (browser-photom #20). 98183ca
# brought the Gaia DR3 query's fallbacks (VizieR CDS, IDIA, CfA, then GAVO
# TAP; PRs #170, #171, #172) and the per-channel Seestar50 egain (PR #173).
# The per-frame API the dashboard uses is unchanged since d6ba44a (PR
# #159): `process_frame(file, prep, *, user_specific_metadata, label,
# fail_fast)` returns a `FrameResult` (outcome, per-filter tables, error,
# QA record) and `qa_record_skipped` rebuilds the record when the writer
# raises; `make_bandaid_processor` is written against those, not
# `process_one_image`. Move the pin deliberately, together with the call in
# `make_bandaid_processor` (the one place this repo calls bandaid; the watch
# notebook goes through it too).
fetch-bandaid = "(test -d bandaid-src || git clone https://github.com/mwcraig/bandaid bandaid-src) && git -C bandaid-src fetch && git -C bandaid-src checkout e29ed5c"
# Pinned to the commit bandaid's pyproject pins (detached HEAD)
fetch-eloy = "(test -d eloy-src || git clone https://github.com/mwcraig/eloy eloy-src) && git -C eloy-src fetch && git -C eloy-src checkout a056c91a945772e0520a89695f8fcd16fda36870"
fetch-starlist-schema = "(test -d aavso-starlist-schema-src || git clone https://github.com/mwcraig/aavso-starlist-schema aavso-starlist-schema-src) && git -C aavso-starlist-schema-src pull --ff-only"
# Writes content/build_info.py (gitignored) with the bandaid and browser-photom
# SHAs this build embeds in every starlist's file name and in the zip name --
# the starlist schema has no software-version field yet. After fetch-bandaid
# so the SHA is the pinned checkout's, and before either build so the module
# is copied into the kernel with the rest of content/.
build-info = { cmd = "python scripts/write_build_info.py", depends-on = ["fetch-bandaid"] }
build = { cmd = "jupyter lite build --contents content --output-dir dist", depends-on = ["fetch-astrowidgets", "fetch-bandaid", "fetch-eloy", "fetch-starlist-schema", "build-info"] }
serve = "python -m http.server 8000 --directory dist"
# Image file server + CORS proxy on :8001 (see content/helper.py), e.g.
#   pixi run helper ~/Downloads/ey_uma
helper = "python scripts/local_helper.py"
test = "pytest"
# The glob is quoted so node expands it: node >= 22 treats a bare directory
# positional as a glob pattern and matches the directory itself, not the
# files under it.
test-js = "node --test 'tests/js/**/*.test.mjs'"

[dependencies]
python = ">=3.11"
pip = "*"
jupyter_server = "*"
jupyterlite-core = "*"
jupyterlite-xeus = ">=5"
# anywidget must be pinned to the SAME version in environment.yml: `jupyter
# lite build` copies the prebuilt labextension out of this env's
# share/jupyter/labextensions, and the front end silently fails to register
# the widget if that build differs from the one the kernel imports.
anywidget = "==0.11.0"
pytest = "*"
# tests/test_feedback_*.py validate report chunks against feedback/report.schema.json
jsonschema = "*"
nodejs = "*"

# Voici lives in its own environment on purpose: voici 0.10 -> voici-core pins
# jupyterlite-core >=0.7,<0.8, and the default environment resolves 0.8.x.
# Putting voici in [dependencies] would silently downgrade the JupyterLab dev
# site that `pixi run build` produces.
[feature.dash.dependencies]
voici = "*"
anywidget = "==0.11.0"

[feature.dash.tasks]
build-dash = { cmd = "voici build --contents content --output-dir dist-dash", depends-on = ["fetch-astrowidgets", "fetch-bandaid", "fetch-eloy", "fetch-starlist-schema", "build-info"] }
serve-dash = "python -m http.server 8010 --directory dist-dash"

[environments]
dash = ["dash"]
