[workspace]
authors = ["Matt Craig <mattwcraig@gmail.com>"]
channels = ["conda-forge"]
name = "browser-photom"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
fetch-astrowidgets = "git -C astrowidgets-src pull --ff-only 2>/dev/null || git clone https://github.com/astropy/astrowidgets astrowidgets-src"
build = { cmd = "jupyter lite build --contents content --output-dir dist", depends-on = ["fetch-astrowidgets"] }
serve = "python -m http.server 8000 --directory dist"
# Image file server + CORS proxy on :8001 (see content/helper.py), e.g.
#   pixi run helper ~/Downloads/ey_uma
helper = "python scripts/local_helper.py"

[dependencies]
python = ">=3.11"
pip = "*"
jupyter_server = "*"
jupyterlite-core = "*"
jupyterlite-xeus = ">=5"
